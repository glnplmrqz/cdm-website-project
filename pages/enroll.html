<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="icon" type="image/x-icon" href="../assets/images/CDM Logo.png"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <link rel="stylesheet" href="../assets/css/enroll.css"/>
    <title>Student's Enrollment</title>
</head>
<body>
    <header class="header">
        <div class="nav-container">
            <a href="landing-page.html#home" class="logo-link">
                <img src="../assets/images/CDM Logo.png" alt="CDM Logo" class="logo-icon">
            </a>
            <button class="hamburger" aria-label="Toggle navigation">
                <i class="fas fa-bars"></i>
            </button>
            <nav class="nav-links">
                <a href="landing-page.html#mission-vision" class="nav-tag">Mission & Vision</a>
                <a href="landing-page.html#maps" class="nav-tag">School Map</a>
                <a href="landing-page.html#programs" class="nav-tag">Programs</a>
            </nav>
        </div>
    </header>

    <div class="form-container">
        <h1>Student Enrollment Form</h1>
        <form onsubmit="handleSubmit(event)">
            <div class="form-group">
                <label for="last-name">Last Name:</label>
                <input type="text" id="last-name" name="last-name" required>
            </div>
            
            <div class="form-group">
                <label for="first-name">First Name:</label>
                <input type="text" id="first-name" name="first-name" required>
            </div>
            
            <div class="form-group">
                <label for="middle-name">Middle Name:</label>
                <input type="text" id="middle-name" name="middle-name">
            </div>
            
            <div class="form-group">
                <label>Gender:</label>
                <div class="radio-group">
                    <label>
                        <input type="radio" name="gender" value="male"> Male
                    </label>
                    <label>
                        <input type="radio" name="gender" value="female"> Female
                    </label>
                </div>
            </div>
            
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <div class="form-group">
                <label for="address">Address:</label>
                <input type="text" id="address" name="address" required>
            </div>
            
            <div class="form-group">
                <label for="parents-guardian">Parents/Guardian:</label>
                <input type="text" id="parents-guardian" name="parents-guardian" required>
            </div>
            
            <div class="form-group">
                <label for="contact-no">Contact No.:</label>
                <input type="text" id="contact-no" name="contact-no" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            
            <div class="form-group">
                <label for="confirm-password">Confirm Password:</label>
                <input type="password" id="confirm-password" name="confirm-password" required>
            </div>

            <div class="form-group">
                <label for="birthday">Birthday:</label>
                <input type="date" id="birthday" name="birthday" class="birthday-input" required>
            </div>
            
            <div class="form-group">
                <label for="high-school">Senior High School Attended:</label>
                <input type="text" id="high-school" name="high-school" required>
            </div>
            
            <div class="form-group">
                <label for="institute">Select Institute:</label>
                <select id="institute" name="institute" required>
                    <option value="">Choose an Institute</option>
                    <option value="ite">Institute of Teacher's Education</option>
                    <option value="ics">Institute of Computer Studies</option>
                    <option value="ibe">Institute of Business and Entrepreneurship</option>
                </select>
            </div>

            <div class="form-group">
                <label for="course">Select Course:</label>
                <select id="course" name="course" required disabled>
                    <option value="">Choose an institute first</option>
                </select>
            </div>
            <button type="submit" class="submit-btn">Submit Enrollment</button>
        </form>
    </div>
</body>
<script src="../assets/js/script.js"></script>
<script src="../assets/js/enroll.js"></script>
</html>
